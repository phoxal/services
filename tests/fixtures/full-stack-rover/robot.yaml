schema: phoxal/robot/v0
robot:
  id: robot-rover
  model: model.xml
  components:
    front_left_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: cba3d5773f034211367bf4032f672df444ec2d33
          path: ddsm115
      mount_site: front_left_wheel_mount
      driver:
        bindings:
          actuator:
          - motion.front_left_actuator
    front_right_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: cba3d5773f034211367bf4032f672df444ec2d33
          path: ddsm115
      mount_site: front_right_wheel_mount
      driver:
        bindings:
          actuator:
          - motion.front_right_actuator
    rear_left_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: cba3d5773f034211367bf4032f672df444ec2d33
          path: ddsm115
      mount_site: rear_left_wheel_mount
      driver:
        bindings:
          actuator:
          - motion.rear_left_actuator
    rear_right_drive:
      source:
        git:
          name: phoxal-component-ddsm115
          url: https://github.com/phoxal/components.git
          rev: cba3d5773f034211367bf4032f672df444ec2d33
          path: ddsm115
      mount_site: rear_right_wheel_mount
      driver:
        bindings:
          actuator:
          - motion.rear_right_actuator
    front_center_tof:
      source:
        git:
          name: phoxal-component-vl53l1x
          url: https://github.com/phoxal/components.git
          rev: cba3d5773f034211367bf4032f672df444ec2d33
          path: vl53l1x
      mount_site: front_center_tof_mount
      driver: {}
supervisor:
  source:
    git:
      name: phoxal-supervisor
      url: https://github.com/phoxal/supervisor.git
      rev: 75de07a892794d1d9eff649e53ce4a1de79e97fa
brain: {}
services:
  kinematics:
    source:
      path: ../../../kinematics
    config:
      wheel_radius_m: 0.11
      wheel_base_m: 0.52
      left_wheels:
      - encoder_id: front_left_drive
        joint_id: front_left_wheel
        longitudinal_offset_m: 0.18
        direction_sign: 1
      - encoder_id: rear_left_drive
        joint_id: rear_left_wheel
        longitudinal_offset_m: -0.18
        direction_sign: 1
      right_wheels:
      - encoder_id: front_right_drive
        joint_id: front_right_wheel
        longitudinal_offset_m: 0.18
        direction_sign: -1
      - encoder_id: rear_right_drive
        joint_id: rear_right_wheel
        longitudinal_offset_m: -0.18
        direction_sign: -1
    bindings:
      encoders:
      - front_left_drive.encoder
      - rear_left_drive.encoder
      - front_right_drive.encoder
      - rear_right_drive.encoder
  world:
    source:
      path: ../../../world
    bindings:
      pose:
      - kinematics.odometry
  navigation:
    source:
      path: ../../../navigation
    config:
      max_expansions_per_step: 32
      goal_tolerance_m: 0.1
    bindings:
      localization:
      - kinematics.odometry
      map:
      - world.revision
  safety:
    source:
      path: ../../../safety
    config:
      input_max_age_ms: 120
      ranges:
      - sensor_id: front_center_tof
    bindings:
      world:
      - world.belief
      world_revision:
      - world.revision
      motion:
      - motion.status
      ranges:
      - front_center_tof.range
  motion:
    source:
      path: ../../../motion
    config:
      max_linear_mps: 0.6
      max_angular_radps: 2.0
      drive:
        differential:
          wheel_radius_m: 0.11
          track_width_m: 0.52
          wheels:
            front_left:
              side: left
              direction_sign: 1
            rear_left:
              side: left
              direction_sign: 1
            front_right:
              side: right
              direction_sign: -1
            rear_right:
              side: right
              direction_sign: -1
    bindings:
      safety:
      - safety.constraints
      measurements:
      - kinematics.odometry
