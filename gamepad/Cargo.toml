[package]
name = "phoxal-service-gamepad"
version = "0.0.0-dev.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Stepped local gamepad input and Motion authority for Phoxal."
homepage = "https://github.com/phoxal/services"
repository = "https://github.com/phoxal/services"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "clippy.toml"]

[[bin]]
name = "phoxal-service-gamepad"
path = "src/main.rs"

[build-dependencies]
phoxal = { version = "0.71.0", default-features = false, features = ["build"] }

[dependencies]
phoxal = { version = "0.71.0", default-features = false, features = ["runtime"] }
gilrs = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.149"

[lints.rust]
unused = "warn"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
